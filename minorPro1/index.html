<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Application Logger</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="script.js"></script>
  </head>
  <body>
    <nav class="nav">
      <div class="container nav-content">
        <div class="brand">
          <span class="brand-icon">🎓</span>
          <h1>Application Logger</h1>
        </div>
        <button id="theme-toggle" class="theme-toggle" type="button">
          <span id="theme-icon">☀️</span>
        </button>
      </div>
    </nav>

    <main class="container main">
      <section>
        <h2>Overview</h2>
        <div class="summary-grid">
          <div class="card">
            <div>
              <p class="muted">Total Applications</p>
              <p class="big" id="total-count">0</p>
            </div>
            <div class="icon-circle blue">📦</div>
          </div>
          <div class="card">
            <div>
              <p class="muted">Interviews</p>
              <p class="big" id="interview-count">0</p>
            </div>
            <div class="icon-circle yellow">👥</div>
          </div>
          <div class="card">
            <div>
              <p class="muted">Offers</p>
              <p class="big success" id="offer-count">0</p>
            </div>
            <div class="icon-circle green">🏆</div>
          </div>
          <div class="card">
            <div>
              <p class="muted">Rejections</p>
              <p class="big danger" id="rejection-count">0</p>
            </div>
            <div class="icon-circle red">⛔</div>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h3>➕ Add New Application</h3>
        </div>
        <div class="panel-body">
          <form id="application-form" class="form-grid">
            <div class="field">
              <label for="company">Company Name</label>
              <input id="company" type="text" placeholder="e.g. Google" required />
            </div>
            <div class="field">
              <label for="role">Role / Position</label>
              <input id="role" type="text" placeholder="e.g. Frontend Engineer" required />
            </div>
            <div class="field">
              <label for="date">Applied Date</label>
              <input id="date" type="date" required />
            </div>
            <div class="field">
              <label for="stage">Current Stage</label>
              <select id="stage" required>
                <option value="Applied">Applied</option>
                <option value="Online Assessment (OA)">Online Assessment (OA)</option>
                <option value="Interview">Interview</option>
                <option value="Offer">Offer</option>
                <option value="Rejected">Rejected</option>
              </select>
            </div>
            <div class="field">
              <label for="result">Result Status</label>
              <select id="result" required>
                <option value="Pending">Pending</option>
                <option value="Cleared">Cleared</option>
                <option value="Rejected">Rejected</option>
              </select>
            </div>
            <div class="field">
              <button class="primary" type="submit">Save Application</button>
            </div>
          </form>
        </div>
      </section>

      <section>
        <h2>Recent Applications</h2>
        <div class="panel">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Company</th>
                  <th>Role</th>
                  <th>Stage</th>
                  <th>Result</th>
                  <th>Date</th>
                  <th class="right">Actions</th>
                </tr>
              </thead>
              <tbody id="application-table-body"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container">
        <p>© 2026 Smart Placement Tracker. Designed for Student Success.</p>
      </div>
    </footer>
  </body>
</html>
